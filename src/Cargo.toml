[workspace]
resolver = "2"
members = [
  "../protocol/duck-ipc-proto",
  "libraries/duck-control",
  "daemons/robotd",
  "daemons/mediad",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serialport = { version = "=4.10.1", default-features = false }
tiny_http = "=0.12.0"
duck-ipc-proto = { path = "../protocol/duck-ipc-proto" }
duck-control = { path = "libraries/duck-control" }
